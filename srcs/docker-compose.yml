services:
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - inception
    env_file:
      - .env
    restart: always
    volumes:
      - wordpress_data:/var/www/html/wordpress
    depends_on:
      - wordpress

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    networks:
      - inception
    env_file:
      - .env
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    networks:
      - inception
    env_file:
      - .env
    restart: always

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    networks:
      - inception
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    restart: always
    volumes:
      - wordpress_data:/var/www/html/wordpress

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    networks:
      - inception
    ports:
      - 8080:8080
    depends_on: 
      - mariadb
      - wordpress
    env_file:
      - .env
    restart: always

  ftp-server:
    build:
      context: ./requirements/bonus/FTP-server
      dockerfile: Dockerfile
    container_name: ftp-server
    depends_on: 
      - mariadb
      - wordpress
    ports:
      - "21:21"
      - "30000-30010:30000-30010"
    volumes:
      - wordpress_data:/var/www/html/wordpress
    networks:
      - inception
    env_file:
      - .env
    restart: always
  

  tdata:
    build: ./requirements/bonus/netdata
    container_name: netdata
    restart: always
    networks:
      - inception
    expose:
      - "19999"

  static:
    build:
      context: ./requirements/bonus/static-page
      dockerfile: Dockerfile
    container_name: static
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html/wordpress
    env_file:
      - .env
    restart: always


networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/tlecuyer/data/mariadb 
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/tlecuyer/data/wordpress 
  
  
